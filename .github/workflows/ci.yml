name: CI

# 为什么需要它：本仓库的 main 会被 server 仓库的发布 CI 直接检出并构建
# （见 komari-slim-server/.github/workflows/release.yml 的 "Checkout web" 步骤）。
# 也就是说，这里推入一个编译不过的改动，要等到打 tag 发版时才会暴露，
# 而且会直接把发版搞失败。本 workflow 在 push / PR 时就拦住它。
#
# Node 版本与 server 的发布 CI 保持一致（22），避免两处构建行为不一致。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint 当前是 0 error / 23 warning，退出码为 0，可以作为门禁。
      # 注意 eslint 的 warning 不会让 CI 失败，只有 error 才会。
      - name: Lint
        run: npm run lint

      # build 脚本是 "tsc -b && vite build"，因此这一步同时做类型检查与打包，
      # 与 server 发布 CI 里的前端构建命令一致。
      - name: Type check and build
        run: npm run build
